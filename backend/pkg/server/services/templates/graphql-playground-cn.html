<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GraphQL 调试台 | PentAGI</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#172033;--panel2:#1e293b;--border:#334155;--text:#e5e7eb;--muted:#94a3b8;--accent:#38bdf8;--danger:#fb7185;--ok:#4ade80}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Microsoft YaHei",sans-serif}button{border:1px solid var(--border);border-radius:6px;background:var(--panel2);color:var(--text);cursor:pointer;padding:7px 12px}button:hover{border-color:var(--accent);background:#26364f}button.primary{background:#0369a1;border-color:#0284c7}button:disabled{cursor:not-allowed;opacity:.55}textarea{display:block;width:100%;resize:vertical;border:1px solid var(--border);border-radius:6px;background:#0b1220;color:#dbeafe;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;padding:10px;outline:none}textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px #38bdf833}.shell{display:flex;height:100%;flex-direction:column}.top{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);background:var(--panel);padding:10px 14px}.brand{font-size:17px;font-weight:650}.sub{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;margin-left:auto}.main{display:grid;min-height:0;flex:1;grid-template-columns:minmax(340px,1fr) minmax(340px,1fr);gap:1px;background:var(--border)}.pane{display:flex;min-height:0;flex-direction:column;background:var(--bg)}.pane-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--panel);padding:8px 12px;color:var(--muted);font-weight:600}.editor{min-height:260px;flex:1;border:0;border-radius:0;padding:14px}.bottom{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);background:var(--panel);padding:10px;gap:10px}.field{display:flex;min-width:0;flex-direction:column;gap:5px}.field label{color:var(--muted);font-size:12px}.small{min-height:80px}.result{min-height:0;flex:1;overflow:auto;margin:0;padding:14px;color:#d1fae5;font:13px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}.status{border-top:1px solid var(--border);padding:7px 12px;color:var(--muted);font-size:12px}.status.ok{color:var(--ok)}.status.error{color:var(--danger)}.docs{display:none;max-height:40%;overflow:auto;border-top:1px solid var(--border);background:#0b1220;padding:12px}.docs.open{display:block}.docs h3{margin:0 0 8px;color:var(--accent);font-size:14px}.type{display:inline-block;margin:2px 4px 2px 0;border:1px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--muted);font:12px ui-monospace,monospace}@media(max-width:800px){.main{grid-template-columns:1fr;overflow:auto}.pane{min-height:45vh}.bottom{grid-template-columns:1fr}.actions{flex-wrap:wrap}.sub{display:none}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
<div><div class="brand">GraphQL 调试台</div><div class="sub" id="endpoint"></div></div>
<div class="actions"><button id="format">格式化</button><button id="clear">清空</button><button id="schema">查看模式</button><button class="primary" id="run">执行查询（Ctrl+Enter）</button></div>
</header>
<main class="main">
<section class="pane"><div class="pane-head"><span>查询</span><span class="sub">在编辑区输入 GraphQL</span></div><textarea id="query" class="editor" spellcheck="false"></textarea><div class="bottom"><div class="field"><label for="variables">变量（JSON）</label><textarea id="variables" class="small" spellcheck="false">{}</textarea></div><div class="field"><label for="headers">请求头（JSON）</label><textarea id="headers" class="small" spellcheck="false">{}</textarea></div></div></section>
<section class="pane"><div class="pane-head"><span>响应</span><span class="sub" id="responseTime"></span></div><pre id="result" class="result">点击“执行查询”开始。</pre><div id="docs" class="docs"><h3>GraphQL 模式</h3><div id="types"></div></div><div id="status" class="status">就绪</div></section>
</main>
</div>
<script>
const endpoint=window.location.pathname.replace(/\/graphql\/playground\/?$/, "/graphql");
const defaultQuery=["# 欢迎使用 GraphQL 调试台","# 输入查询后按 Ctrl+Enter 执行。","","query {","  __typename","}"].join("\n");
const query=document.getElementById("query"),variables=document.getElementById("variables"),headers=document.getElementById("headers"),result=document.getElementById("result"),status=document.getElementById("status"),responseTime=document.getElementById("responseTime"),docs=document.getElementById("docs"),types=document.getElementById("types");
document.getElementById("endpoint").textContent=endpoint;query.value=defaultQuery;
function setStatus(text,kind=""){status.textContent=text;status.className="status "+kind}
function prettyJSON(text,label){try{return JSON.parse(text||"{}")}catch(error){throw new Error(label+"不是有效的 JSON："+error.message)}}
function formatQuery(){let indent=0;query.value=query.value.split(/\r?\n/).map(line=>{const t=line.trim();if(t.startsWith("}"))indent=Math.max(0,indent-1);const out="  ".repeat(indent)+t;if(t.endsWith("{"))indent++;return out}).join("\n")}
async function run(){const started=performance.now(),button=document.getElementById("run");button.disabled=true;setStatus("正在请求…");try{const customHeaders=prettyJSON(headers.value,"请求头"),vars=prettyJSON(variables.value,"变量"),response=await fetch(endpoint,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json",...customHeaders},body:JSON.stringify({query:query.value,variables:vars})}),payload=await response.json();result.textContent=JSON.stringify(payload,null,2);responseTime.textContent=Math.round(performance.now()-started)+" ms";setStatus(!response.ok||payload.errors?"请求返回错误（"+response.status+"）":"请求成功（"+response.status+"）",!response.ok||payload.errors?"error":"ok")}catch(error){result.textContent=String(error.message||error);setStatus("请求失败","error")}finally{button.disabled=false}}
async function loadSchema(){setStatus("正在读取模式…");try{const response=await fetch(endpoint,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:"{ __schema { types { name kind } } }"})}),payload=await response.json();if(payload.errors)throw new Error(payload.errors[0].message);types.innerHTML="";(payload.data.__schema.types||[]).filter(item=>item.name&&!item.name.startsWith("__")).sort((a,b)=>a.name.localeCompare(b.name)).forEach(item=>{const span=document.createElement("span");span.className="type";span.textContent=item.kind+": "+item.name;types.appendChild(span)});docs.classList.add("open");setStatus("模式已加载","ok")}catch(error){setStatus("模式加载失败："+String(error.message||error),"error")}}
document.getElementById("run").addEventListener("click",run);document.getElementById("format").addEventListener("click",formatQuery);document.getElementById("clear").addEventListener("click",()=>{query.value="";result.textContent="";setStatus("已清空")});document.getElementById("schema").addEventListener("click",loadSchema);query.addEventListener("keydown",event=>{if((event.ctrlKey||event.metaKey)&&event.key==="Enter"){event.preventDefault();run()}});
</script>
</body>
</html>
