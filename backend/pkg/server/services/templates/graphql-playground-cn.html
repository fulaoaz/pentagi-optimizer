<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>GraphQL 调试台 | PentAGI</title>
<style>body{height:100%;margin:0;width:100%;overflow:hidden}#graphiql{height:100vh}</style>
<link rel="stylesheet" href="https://unpkg.com/graphiql@3/graphiql.min.css" />
</head>
<body>
<div id="graphiql">正在加载 GraphQL 调试台……</div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/graphiql@3/graphiql.min.js"></script>
<script src="https://unpkg.com/graphiql@3/graphiql-subscriptions-fetcher.browser.min.js"></script>
<script>
function graphiqlFetcher(graphQLParams) {
  return fetch(window.location.origin + "/graphql", {
    method: "post",
    headers: { "Content-Type": "application/json", "X-Applied-Migrations": "1" },
    credentials: "same-origin",
    body: JSON.stringify(graphQLParams),
  }).then((response) => response.json());
}
ReactDOM.render(
  React.createElement(GraphiQL, { fetcher: graphiqlFetcher, headerEditorEnabled: true }),
  document.getElementById("graphiql"),
);
</script>
</body>
</html>
