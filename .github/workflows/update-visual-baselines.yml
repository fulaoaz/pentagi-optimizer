name: Update visual baselines

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - name: Rebuild visual baselines in the pinned container
        working-directory: frontend
        run: e2e/tools/run-visual.sh --update
      - name: Commit regenerated baselines
        run: |
          git config user.name "visual-baseline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/e2e
          if git diff --cached --quiet; then
            echo "Baselines unchanged"
          else
            git commit -m "test(visual): regenerate baselines for settings sidebar change"
            git push
          fi